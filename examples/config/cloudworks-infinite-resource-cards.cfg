# Creative-tab/JEI card presets only. Restart the game after changes.
# Empty cards are always listed first and cannot be used.
# Resources use the same parser as the physical card's Resources NBT.
# Optional suffix: |nodeLimit=4,outputAmount=1000
# nodeLimit enables limited placement; values must be positive longs.
# Examples (add them to the list below to enable):
# item:minecraft:coal_ore|nodeLimit=1,outputAmount=16
# item:minecraft:coal_ore|nodeLimit=4,outputAmount=256
# gas:oxygen|nodeLimit=4,outputAmount=1000
# item:minecraft:coal@1

infinite_resource_cards {
    S:infiniteResourceCards <
        fluid:water
    >
}
